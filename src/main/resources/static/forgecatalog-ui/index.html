      (function () {
        var savedTheme = null;
        try { savedTheme = localStorage.getItem("forgecatalog-theme"); } catch (error) {}
        var theme = savedTheme === "light" || savedTheme === "dark"

        document.documentElement.dataset.theme = theme;
      })();

    </header>

    <main id="top">
      <section class="page-intro" aria-labelledby="page-title">
        <div class="page-intro-inner">
          <p class="eyebrow">Developer documentation</p>
          <h1 id="page-title">Blast Radius Calculator API</h1>
          <p>Explore endpoints, review request and response schemas, and run authenticated calls against the service.</p>
        </div>
      </section>
      <div id="swagger-ui" aria-label="Interactive API endpoints"></div>
    </main>

    <script src="/swagger-ui/swagger-ui-bundle.js" charset="UTF-8"></script>
    <script src="/swagger-ui/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
    <script>
      (function () {
        var toggle = document.getElementById("theme-toggle");
        var themeColor = document.querySelector('meta[name="theme-color"]');
        var systemTheme = window.matchMedia("(prefers-color-scheme: dark)");

        function updateThemeControls(theme) {
          var isDark = theme === "dark";
          toggle.setAttribute("aria-pressed", String(isDark));
          toggle.setAttribute("aria-label", isDark ? "Switch to light theme" : "Switch to dark theme");
          toggle.setAttribute("title", isDark ? "Switch to light theme" : "Switch to dark theme");
          if (themeColor) themeColor.setAttribute("content", isDark ? "#171c1f" : "#ffffff");
        }

        function setTheme(theme, savePreference) {
          document.documentElement.dataset.theme = theme;
          updateThemeControls(theme);
          if (savePreference) {
            try { localStorage.setItem("forgecatalog-theme", theme); } catch (error) {}
          }
        }

        updateThemeControls(document.documentElement.dataset.theme || "light");
        toggle.addEventListener("click", function () {
          setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true);
        });
        function followSystemTheme(event) {
          var savedTheme = null;
          try { savedTheme = localStorage.getItem("forgecatalog-theme"); } catch (error) {}
          if (!savedTheme) setTheme(event.matches ? "dark" : "light", false);
        }
        if (systemTheme.addEventListener) systemTheme.addEventListener("change", followSystemTheme);
        else if (systemTheme.addListener) systemTheme.addListener(followSystemTheme);
      })();

      window.onload = function () {
        window.ui = SwaggerUIBundle({
          url: "/v3/api-docs",
          dom_id: "#swagger-ui",
          deepLinking: true,
          displayRequestDuration: true,
          filter: true,
          persistAuthorization: true,
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          plugins: [SwaggerUIBundle.plugins.DownloadUrl],
          layout: "StandaloneLayout"
        });
      };
    </script>
  </body>
</html>
