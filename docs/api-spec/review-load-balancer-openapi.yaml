openapi: 3.1.0
info:
  title: Review Load Balancer
  description: "Intelligent code review assignment engine. Balances PR review workload\
    \  fairly across the team while respecting expertise, availability, time  zones,\
    \ and current review queue. Prevents the \"5 reviews for one person,  0 for another\"\
    \ imbalance that burns out senior engineers and starves  juniors of learning opportunities.\
    \ Tracks review SLAs and surfaces  bottlenecks before they delay releases. "
  contact:
    name: ForgeSphere Developer Productivity
    email: devex@forgesphere.example.com
  version: 1.0.0
servers:
- url: http://127.0.0.1:18080
  description: Generated server url
tags:
- name: Assignments
  description: Auto-assign and manage PR reviewers.
- name: Workload
  description: Track review workload and fairness metrics.
paths:
  /actuator/health:
    get:
      tags:
      - Health
      summary: Health
      operationId: getHealth
      responses:
        "200":
          description: Monitoring data returned successfully
          content:
            application/json:
              schema:
                type: object
  /actuator/health/liveness:
    get:
      tags:
      - Health
      summary: Liveness
      operationId: getLiveness
      responses:
        "200":
          description: Monitoring data returned successfully
          content:
            application/json:
              schema:
                type: object
  /actuator/health/readiness:
    get:
      tags:
      - Health
      summary: Readiness
      operationId: getReadiness
      responses:
        "200":
          description: Monitoring data returned successfully
          content:
            application/json:
              schema:
                type: object
  /actuator/metrics:
    get:
      tags:
      - Health
      summary: Metrics
      operationId: getMetrics
      responses:
        "200":
          description: Monitoring data returned successfully
          content:
            application/json:
              schema:
                type: object
  /actuator/prometheus:
    get:
      tags:
      - Health
      summary: Prometheus
      operationId: getPrometheusMetrics
      responses:
        "200":
          description: Prometheus metrics returned successfully
          content:
            text/plain:
              schema:
                type: string
  /oauth2/token:
    post:
      tags:
      - Security
      summary: Get OAuth2 Token
      description: Uses the OAuth 2.0 client credentials grant. Authenticate the client
        with HTTP Basic credentials and submit grant_type=client_credentials.
      operationId: getOAuth2Token
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  default: client_credentials
                  description: OAuth 2.0 grant type
                  enum:
                  - client_credentials
                scope:
                  type: string
                  description: Space-delimited scopes
                  example: api.read api.write
              required:
              - grant_type
        required: true
      responses:
        "200":
          description: Access token issued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    format: int32
                    example: 3600
                  scope:
                    type: string
                    example: api.read api.write
        "400":
          description: Invalid token request
        "401":
          description: Invalid client credentials
  /v1/assignments:
    post:
      tags:
      - Assignments
      summary: Assign reviewers to a pull request
      description: "Automatically assigns the optimal reviewers for a pull request\
        \ based  on file ownership, expertise, current workload, availability, and\
        \  fairness history. Respects constraints like time zone, on-call status,\
        \  and vacation. Returns the selected reviewers with reasoning. "
      operationId: assignReviewers
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignReviewersRequest"
        required: true
      responses:
        "201":
          description: Reviewers assigned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "400":
          description: Invalid request payload or missing required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Reviewers already assigned for this PR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /v1/assignments/{assignmentId}/reassign:
    post:
      tags:
      - Assignments
      summary: Reassign a PR to a different reviewer
      description: "Manually reassigns a review to another reviewer. Use when a reviewer\
        \  goes on leave, is overloaded, or lacks context. The engine validates  that\
        \ the new assignment preserves fairness. "
      operationId: reassignReviewer
      parameters:
      - name: assignmentId
        in: path
        description: Unique identifier of the assignment.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignReviewerRequest"
        required: true
      responses:
        "200":
          description: Review reassigned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "400":
          description: Invalid request payload or missing required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Assignment or team not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Reassignment would violate fairness rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /v1/workload:
    get:
      tags:
      - Workload
      summary: Get current review workload across the team
      description: "Returns a live snapshot of every engineer's review queue — pending\
        \  reviews, average response time, review SLA compliance, and fairness  score.\
        \ Used by managers to spot overloaded or idle reviewers before  problems arise. "
      operationId: getTeamWorkload
      parameters:
      - name: teamName
        in: query
        description: Team to analyze.
        required: true
        schema:
          type: string
      - name: repoId
        in: query
        description: Optional. Filter to a specific repository.
        required: false
        schema:
          type: string
      - name: windowDays
        in: query
        description: Analysis window in days.
        required: false
        schema:
          type: integer
          format: int32
          default: 30
          maximum: 90
          minimum: 7
      - name: sortBy
        in: query
        description: Sort order for the results.
        required: false
        schema:
          type: string
          default: PENDING_REVIEWS
      responses:
        "200":
          description: Team workload snapshot retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkloadReport"
        "400":
          description: Invalid request payload or missing required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Assignment or team not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /v1/assignments/{assignmentId}:
    get:
      tags:
      - Assignments
      summary: Get the details of a review assignment
      description: "Returns the current state of a review assignment — reviewers,\
        \  reasoning behind their selection, review status, and SLA tracking. "
      operationId: getAssignment
      parameters:
      - name: assignmentId
        in: path
        description: Unique identifier of the assignment.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Assignment details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "404":
          description: Assignment or team not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
components:
  schemas:
    Assignment:
      type: object
      properties:
        assignmentId:
          type: string
          format: uuid
          example: 9c8f1a3b-6d7e-4a12-8f5e-123456789abc
        repoId:
          type: string
          example: forgesphere/payment-service
        pullRequestId:
          type: integer
          format: int32
          example: 4821
        pullRequestUrl:
          type: string
          example: https://github.com/forgesphere/payment-service/pull/4821
        author:
          type: string
          example: amit.kumar@forgesphere.example.com
        reviewers:
          type: array
          description: Assigned reviewers with reasoning.
          items:
            $ref: "#/components/schemas/AssignmentReviewersInner"
        requiredReviewerCount:
          type: integer
          format: int32
          example: 2
        priority:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
          example: HIGH
        status:
          type: string
          enum:
          - OPEN
          - PARTIALLY_REVIEWED
          - FULLY_REVIEWED
          - MERGED
          - CLOSED
          example: PARTIALLY_REVIEWED
        slaDeadline:
          type: string
          format: date-time
          description: When the review should be completed by.
          example: 2026-10-06T18:00Z
        slaStatus:
          type: string
          enum:
          - ON_TRACK
          - AT_RISK
          - BREACHED
          example: ON_TRACK
        filesChanged:
          type: array
          items:
            $ref: "#/components/schemas/AssignmentFilesChangedInner"
        assignedAt:
          type: string
          format: date-time
        firstReviewAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        totalReviewTimeMinutes:
          type: integer
          format: int32
          example: 42
      required:
      - assignedAt
      - assignmentId
      - author
      - priority
      - pullRequestId
      - repoId
      - reviewers
      - status
    AssignmentFilesChangedInner:
      type: object
      properties:
        path:
          type: string
          example: src/main/java/com/forgesphere/payment/DiscountService.java
        linesAdded:
          type: integer
          format: int32
          example: 145
        linesRemoved:
          type: integer
          format: int32
          example: 32
    AssignmentReviewersInner:
      type: object
      properties:
        engineerId:
          type: string
          example: priya.sharma@forgesphere.example.com
        name:
          type: string
          example: Priya Sharma
        role:
          type: string
          enum:
          - PRIMARY
          - SECONDARY
          - SUBJECT_EXPERT
          - LEARNING_OPPORTUNITY
          example: PRIMARY
        expertiseMatch:
          type: number
          description: 0-1 score of how well this reviewer knows the files.
          example: 0.92
        currentLoad:
          type: integer
          format: int32
          description: Pending reviews at assignment time.
          example: 3
        fairnessScore:
          type: number
          description: Higher = more reviews taken historically.
          example: 78.5
        reasoning:
          type: string
          example: Owns 68% of the changed files; has capacity (3 pending reviews);
            last reviewed 4 days ago.
        status:
          type: string
          enum:
          - PENDING
          - IN_REVIEW
          - APPROVED
          - CHANGES_REQUESTED
          - DISMISSED
          example: IN_REVIEW
        respondedAt:
          type: string
          format: date-time
      required:
      - currentLoad
      - engineerId
      - expertiseMatch
      - name
      - role
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
          example: 409
        errorCode:
          type: string
          example: FAIRNESS_VIOLATION
        message:
          type: string
          example: Reassignment would push Priya above the fair-review threshold.
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          example: /v1/assignments/9c8f1a3b/reassign
        serviceTransactionId:
          type: string
          example: 523f52b2-64a5-465e-b245-3efbe78f70ae
      required:
      - message
      - path
      - status
      - timestamp
    AssignReviewersRequest:
      type: object
      properties:
        repoId:
          type: string
          description: Repository containing the PR.
          example: forgesphere/payment-service
        pullRequestId:
          type: integer
          format: int32
          description: Pull request number.
          example: 4821
        author:
          type: string
          description: PR author (excluded from reviewers).
          example: amit.kumar@forgesphere.example.com
        filesChanged:
          type: array
          description: List of changed files with complexity.
          items:
            $ref: "#/components/schemas/AssignReviewersRequestFilesChangedInner"
        requiredReviewerCount:
          type: integer
          format: int32
          description: How many reviewers needed.
          example: 2
          maximum: 5
          minimum: 1
        priority:
          type: string
          description: PR urgency — affects assignment speed.
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
          example: HIGH
        requiredExpertise:
          type: array
          description: Optional. Required domain knowledge.
          example:
          - payments
          - discount-logic
          items:
            type: string
        excludeReviewers:
          type: array
          description: Reviewers to explicitly exclude.
          example:
          - rahul.verma@forgesphere.example.com
          items:
            type: string
      required:
      - author
      - filesChanged
      - pullRequestId
      - repoId
    AssignReviewersRequestFilesChangedInner:
      type: object
      properties:
        path:
          type: string
          example: src/main/java/com/forgesphere/payment/DiscountService.java
        linesAdded:
          type: integer
          format: int32
          example: 145
        linesRemoved:
          type: integer
          format: int32
          example: 32
      required:
      - linesAdded
      - linesRemoved
      - path
    ReassignReviewerRequest:
      type: object
      properties:
        currentReviewer:
          type: string
          description: Reviewer being replaced.
          example: amit.kumar@forgesphere.example.com
        newReviewer:
          type: string
          description: New reviewer to assign.
          example: priya.sharma@forgesphere.example.com
        reason:
          type: string
          description: Reason for reassignment (min 15 chars).
          example: Original reviewer is on PTO; reassigning to backup.
          maxLength: 2147483647
          minLength: 15
        notifyChannels:
          type: array
          description: Channels to notify of the reassignment.
          example:
          - SLACK
          items:
            type: string
            enum:
            - EMAIL
            - SLACK
            - PAGERDUTY
            - WEBHOOK
      required:
      - currentReviewer
      - newReviewer
      - reason
    WorkloadReport:
      type: object
      properties:
        teamName:
          type: string
          example: payments-team
        windowDays:
          type: integer
          format: int32
          example: 30
        generatedAt:
          type: string
          format: date-time
        fairnessScore:
          $ref: "#/components/schemas/WorkloadReportFairnessScore"
        teamSummary:
          $ref: "#/components/schemas/WorkloadReportTeamSummary"
        engineerBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/WorkloadReportEngineerBreakdownInner"
        bottleneckAnalysis:
          $ref: "#/components/schemas/WorkloadReport_bottleneckAnalysis"
        recommendations:
          type: array
          example:
          - Amit has 7 pending reviews vs team avg of 4 — pause new assignments for
            48h.
          - Priya's SLA compliance dropped to 82% — consider rebalancing her queue.
          - 3 junior engineers have taken <10 reviews in 30 days — assign more for
            growth.
          - Average time to first review is 4h — consider enabling 'review hours'
            blocks.
          items:
            type: string
      required:
      - engineerBreakdown
      - fairnessScore
      - generatedAt
      - recommendations
      - teamName
      - teamSummary
      - windowDays
    WorkloadReportEngineerBreakdownInner:
      type: object
      properties:
        engineerId:
          type: string
          example: amit.kumar@forgesphere.example.com
        name:
          type: string
          example: Amit Kumar
        seniority:
          type: string
          enum:
          - JUNIOR
          - MID
          - SENIOR
          - STAFF
          - PRINCIPAL
          example: SENIOR
        pendingReviews:
          type: integer
          format: int32
          description: Reviews currently in queue.
          example: 7
        reviewsCompleted:
          type: integer
          format: int32
          example: 42
        reviewsRequested:
          type: integer
          format: int32
          example: 51
        avgResponseTimeMinutes:
          type: integer
          format: int32
          example: 180
        medianResponseTimeMinutes:
          type: integer
          format: int32
          example: 95
        slaCompliancePercent:
          type: number
          format: double
          example: 82.5
        approvalRatePercent:
          type: number
          format: double
          example: 88.4
        changesRequestedRatePercent:
          type: number
          format: double
          example: 22.1
        fairnessScore:
          type: number
          description: Higher = more reviews taken relative to team.
          example: 92.5
        fairnessDelta:
          type: number
          description: Difference from team average (+ = more reviews).
          example: 10.5
        burnoutRisk:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
          example: MEDIUM
        expertiseAreas:
          type: array
          example:
          - payments
          - discount-logic
          - refunds
          items:
            type: string
        availability:
          type: string
          enum:
          - AVAILABLE
          - ON_LEAVE
          - ONCALL
          - FOCUS_TIME
          - DO_NOT_DISTURB
          example: AVAILABLE
      required:
      - avgResponseTimeMinutes
      - engineerId
      - fairnessScore
      - name
      - pendingReviews
      - reviewsCompleted
    WorkloadReportFairnessScore:
      type: object
      properties:
        overall:
          type: number
          description: 100 = perfectly balanced review load.
          example: 82
          maximum: 100
          minimum: 0
        grade:
          type: string
          enum:
          - EXCELLENT
          - GOOD
          - FAIR
          - UNFAIR
          - CRITICAL
          example: GOOD
        standardDeviation:
          type: number
          description: Lower is better.
          example: 3.8
      required:
      - grade
      - overall
    WorkloadReportTeamSummary:
      type: object
      properties:
        totalPRs:
          type: integer
          format: int32
          example: 245
        totalReviews:
          type: integer
          format: int32
          example: 482
        avgResponseTimeMinutes:
          type: integer
          format: int32
          example: 145
        avgTimeToMergeHours:
          type: number
          format: double
          example: 18.5
        slaCompliancePercent:
          type: number
          format: double
          example: 91.2
        reviewsPerEngineer:
          type: number
          format: double
          example: 40.2
      required:
      - avgResponseTimeMinutes
      - slaCompliancePercent
      - totalPRs
      - totalReviews
    WorkloadReport_bottleneckAnalysis:
      type: object
      description: Where reviews are getting stuck.
      properties:
        slowestReviewers:
          type: array
          example:
          - rahul.verma@forgesphere.example.com
          items:
            type: string
        mostBlockedPRs:
          type: integer
          format: int32
          example: 8
        avgWaitTimeForFirstReviewMinutes:
          type: integer
          format: int32
          example: 240
        reviewersAtCapacity:
          type: array
          example:
          - amit.kumar@forgesphere.example.com
          items:
            type: string
  securitySchemes:
    bearerAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            api.read: Read access to the API
            api.write: Write access to the API
